<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kitob — Andijon vagon deposi</title>
<meta name="theme-color" content="#15171a">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="tema.js"></script>
<style>
  body{display:flex;flex-direction:column;min-height:100vh;background:#0e0f11;}
  .vbar{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border-bottom:1px solid var(--border);
    padding:9px 12px;position:sticky;top:0;z-index:10;
  }
  .vbar .v-back{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    padding:7px 11px;border-radius:var(--radius);cursor:pointer;
    font-size:13px;white-space:nowrap;font-family:inherit;
  }
  .vbar .v-back:hover{color:var(--text);border-color:var(--accent);}
  .v-title{
    flex:1;min-width:0;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;
    text-transform:uppercase;font-size:14px;letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);
  }
  .v-dl{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    width:34px;height:34px;border-radius:var(--radius);cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:15px;
    text-decoration:none;
  }
  .v-dl:hover{color:var(--accent);border-color:var(--accent);}
  button.v-dl{font-family:inherit;font-size:17px;}
  button.v-dl:active{transform:scale(.93);}
  .rot-hint{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--surface-raised);border:1px solid var(--accent-dim);
    color:var(--text);padding:8px 15px;border-radius:99px;
    font-size:13px;z-index:20;opacity:0;pointer-events:none;
    transition:opacity .2s ease;
  }
  .rot-hint.on{opacity:1;}

  /* Masshtab boshqaruvi */
  .zoom-box{
    position:fixed;right:12px;bottom:16px;z-index:15;
    display:flex;align-items:center;gap:2px;
    background:rgba(31,34,38,.95);border:1px solid var(--border);
    border-radius:99px;padding:4px;
    box-shadow:0 3px 12px rgba(0,0,0,.5);
  }
  .zoom-box button{
    width:38px;height:38px;border-radius:50%;
    background:none;border:none;color:var(--text);
    font-size:20px;line-height:1;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
  }
  .zoom-box button:hover{color:var(--accent);}
  .zoom-box button:active{background:var(--surface-raised);}
  .zoom-box span{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12px;color:var(--text-dim);min-width:44px;text-align:center;
  }

  /* Yaqinlashtirilganda yon tomonga surish */
  .pages.zoomed{align-items:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .pages.zoomed .pg{flex:none;}

  .pages{flex:1;padding:12px 8px 30px;display:flex;flex-direction:column;
    align-items:center;gap:12px;}
  .pg{
    background:#fff;max-width:none;border-radius:3px;
    box-shadow:0 2px 10px rgba(0,0,0,.5);position:relative;
  }
  .pg canvas{display:block;width:100%;height:auto;border-radius:3px;}
  .pg-ph{
    display:flex;align-items:center;justify-content:center;
    background:#1c1f22;color:#6b6e70;border:1px solid var(--border);
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;
    border-radius:3px;
  }
  .v-status{
    color:var(--text-dim);text-align:center;padding:40px 20px;font-size:14px;line-height:1.6;
  }
  .ld-pct{
    font-family:'Oswald','Arial Narrow',system-ui,sans-serif;
    font-size:38px;color:var(--accent);line-height:1;margin-bottom:14px;
  }
  .ld-track{
    width:100%;max-width:260px;height:6px;margin:0 auto 12px;
    background:var(--border);border-radius:3px;overflow:hidden;
  }
  .ld-track i{
    display:block;height:100%;width:0%;background:var(--accent);
    border-radius:3px;transition:width .25s ease;
  }
  .ld-size{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12.5px;color:var(--text-dim);
  }
  .v-status .sp{
    display:block;width:26px;height:26px;margin:0 auto 14px;
    border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .v-err{color:#d9756a;}
  .v-fallback{
    display:inline-block;margin-top:14px;background:var(--accent);color:#1a1a1a;
    padding:11px 18px;border-radius:var(--radius);font-weight:600;text-decoration:none;
  }
  .v-count{
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;
    color:var(--text-dim);flex:none;
  }
  @media (prefers-reduced-motion: reduce){.v-status .sp{animation:none;}}
</style>
</head>
<body>

<div class="vbar">
  <button class="v-back" id="backBtn">← Ortga</button>
  <span class="v-title" id="vTitle">Yuklanmoqda...</span>
  <span class="v-count" id="vCount"></span>
  <button class="v-dl" id="rotBtn" title="Aylantirish" aria-label="Sahifani aylantirish">⟳</button>
  <a class="v-dl" id="dlLink" download title="Yuklab olish" aria-label="Yuklab olish">⤓</a>
</div>

<div class="zoom-box" id="zoomBox" hidden>
  <button id="zOut" aria-label="Uzoqlashtirish">−</button>
  <span id="zoomLbl">100%</span>
  <button id="zIn" aria-label="Yaqinlashtirish">+</button>
</div>

<div class="pages" id="pages">
  <div class="v-status" id="loadBox">
    <div class="ld-pct" id="ldPct">0%</div>
    <div class="ld-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"
         aria-valuenow="0" id="ldBar"><i id="ldFill"></i></div>
    <div class="ld-size" id="ldSize">Kitob yuklanmoqda...</div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var file = params.get('f') || '';
  var nom  = params.get('nom') || 'Kitob';

  var titleEl = document.getElementById('vTitle');
  var countEl = document.getElementById('vCount');
  var pagesEl = document.getElementById('pages');
  var dlLink  = document.getElementById('dlLink');

  titleEl.textContent = nom;
  document.title = nom + ' \u2014 Andijon vagon deposi';

  document.getElementById('backBtn').addEventListener('click', function () {
    if (history.length > 1) history.back();
    else location.href = 'index.html#kutubxona';
  });

  function status(html, isErr) {
    pagesEl.innerHTML = '<div class="v-status' + (isErr ? ' v-err' : '') + '">' + html + '</div>';
  }

  if (!file || /^[a-z]+:/i.test(file) || file.indexOf('..') !== -1) {
    status('Kitob manzili noto\u2018g\u2018ri.', true);
    return;
  }
  dlLink.href = file;

  var fallback = 'Kitobni ko\u2018rsatib bo\u2018lmadi.<br>' +
    'Uni telefoningizga yuklab olib ochishingiz mumkin.<br>' +
    '<a class="v-fallback" href="' + file.replace(/"/g, '&quot;') + '" download>Yuklab olish</a>';

  /* ---------- Yuklanish ko'rsatkichi ---------- */
  var pctEl  = document.getElementById('ldPct');
  var fillEl = document.getElementById('ldFill');
  var barEl  = document.getElementById('ldBar');
  var sizeEl = document.getElementById('ldSize');
  function mb(b) { return (b / 1048576).toFixed(1) + ' MB'; }
  function prog(loaded, total, note) {
    if (!pctEl || !document.body.contains(pctEl)) return;
    if (note) { pctEl.textContent = note; fillEl.style.width = '100%'; sizeEl.textContent = ''; return; }
    if (total) {
      var pct = Math.min(100, Math.round(loaded / total * 100));
      pctEl.textContent = pct + '%';
      fillEl.style.width = pct + '%';
      barEl.setAttribute('aria-valuenow', pct);
      sizeEl.textContent = mb(loaded) + ' / ' + mb(total);
    } else {
      pctEl.textContent = mb(loaded);
      sizeEl.textContent = 'Yuklanmoqda...';
    }
  }

  /* ---------- Kitobni yuklash va saqlab qo'yish ----------
     Bir marta yuklangan kitob brauzer xotirasida saqlanadi,
     keyingi safar internetsiz ham darhol ochiladi. */
  var CACHE = 'telejka-kitoblar-v1';

  function fromCache(url) {
    if (!window.caches) return Promise.resolve(null);
    return caches.open(CACHE)
      .then(function (c) { return c.match(url); })
      .then(function (r) { return r ? r.arrayBuffer() : null; })
      .catch(function () { return null; });
  }

  function toCache(url, buf) {
    if (!window.caches) return;
    try {
      caches.open(CACHE).then(function (c) {
        c.put(url, new Response(buf.slice(0), { headers: { 'Content-Type': 'application/pdf' } }));
      }).catch(function () {});
    } catch (e) {}
  }

  function download(url) {
    return fetch(url).then(function (resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var total = parseInt(resp.headers.get('content-length'), 10) || 0;
      if (!resp.body || !resp.body.getReader) {
        return resp.arrayBuffer().then(function (b) { prog(b.byteLength, b.byteLength); return b; });
      }
      var reader = resp.body.getReader();
      var chunks = [], got = 0;
      return (function pump() {
        return reader.read().then(function (res) {
          if (res.done) {
            var out = new Uint8Array(got), off = 0;
            for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], off); off += chunks[i].length; }
            return out.buffer;
          }
          chunks.push(res.value);
          got += res.value.length;
          prog(got, total);
          return pump();
        });
      })();
    });
  }

  function loadBytes(url) {
    return fromCache(url).then(function (buf) {
      if (buf && buf.byteLength) { prog(0, 0, 'Xotiradan'); return buf; }
      return download(url).then(function (b) { toCache(url, b); return b; });
    });
  }

  /* ---------- PDF.js ---------- */
  var CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  var s = document.createElement('script');
  s.src = CDN + 'pdf.min.js';
  s.onerror = function () {
    status('Internet aloqasi sust bo\u2018lgani uchun ko\u2018ruvchi yuklanmadi.<br>' + fallback, true);
  };

  s.onload = function () {
    var pdfjsLib = window.pdfjsLib;
    if (!pdfjsLib) { status(fallback, true); return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + 'pdf.worker.min.js';

    loadBytes(file).then(function (bytes) {
      return pdfjsLib.getDocument({ data: bytes }).promise;
    }).then(function (pdf) {
      start(pdf);
    }).catch(function () {
      status('Kitobni ochib bo\u2018lmadi. Fayl topilmadi yoki buzilgan.<br>' + fallback, true);
    });
  };
  document.head.appendChild(s);

  /* ================= KO'RSATISH ================= */
  function start(pdf) {
    pagesEl.innerHTML = '';
    countEl.textContent = pdf.numPages + ' bet';

    var wrappers = [];
    var live = {};              // chizilgan betlar: {bet: burilish+masshtab izi}
    var rotation = 0;
    var zoom = 1;
    var ratio = 1.4;
    var ROT_KEY = 'telejka:burilish:' + file;
    try { rotation = (parseInt(localStorage.getItem(ROT_KEY), 10) || 0) % 360; } catch (e) {}

    var zoomBox = document.getElementById('zoomBox');
    var zoomLbl = document.getElementById('zoomLbl');
    zoomBox.hidden = false;

    var hint = document.createElement('div');
    hint.className = 'rot-hint';
    document.body.appendChild(hint);
    var hintTimer;
    function showHint(t) {
      hint.textContent = t;
      hint.classList.add('on');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(function () { hint.classList.remove('on'); }, 1400);
    }

    function baseWidth() {
      var w = pagesEl.clientWidth - 16;
      if (!(w > 0)) w = (window.innerWidth || 360) - 24;
      return Math.max(280, Math.min(900, w));
    }
    function pageWidth() { return Math.round(baseWidth() * zoom); }
    function stamp() { return rotation + '/' + zoom; }

    /* --- Betni bo'shatish (telefon xotirasi to'lib qolmasligi uchun) --- */
    function freePage(el) {
      if (!live[el.dataset.page]) return;
      delete live[el.dataset.page];
      var c = el.querySelector('canvas');
      if (c) { c.width = 0; c.height = 0; c.remove(); }
      el.classList.add('pg-ph');
      el.style.height = Math.round(pageWidth() * ratio) + 'px';
      el.textContent = el.dataset.page + '-bet';
    }

    function renderPage(el) {
      var n = +el.dataset.page;
      var st = stamp();
      if (live[n] === st) return;
      live[n] = st;
      pdf.getPage(n).then(function (page) {
        if (stamp() !== st) return;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var base = page.getViewport({ scale: 1, rotation: rotation });
        var sc = (pageWidth() / base.width) * dpr;
        var vp = page.getViewport({ scale: sc, rotation: rotation });
        var canvas = document.createElement('canvas');
        canvas.width = Math.floor(vp.width);
        canvas.height = Math.floor(vp.height);
        var ctx = canvas.getContext('2d');
        page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
          if (stamp() !== st || live[n] !== st) { canvas.width = 0; canvas.height = 0; return; }
          el.classList.remove('pg-ph');
          el.style.height = '';
          el.textContent = '';
          el.appendChild(canvas);
        }).catch(function () { delete live[n]; });
      }).catch(function () { delete live[n]; });
    }

    var ioDraw = null, ioFree = null;
    function observe() {
      if (ioDraw) ioDraw.disconnect();
      if (ioFree) ioFree.disconnect();
      if (!('IntersectionObserver' in window)) { wrappers.forEach(renderPage); return; }
      ioDraw = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) renderPage(e.target); });
      }, { rootMargin: '400px 0px' });
      // Uzoqlashgan betlarni xotiradan bo'shatamiz
      ioFree = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (!e.isIntersecting) freePage(e.target); });
      }, { rootMargin: '1200px 0px' });
      wrappers.forEach(function (w) { ioDraw.observe(w); ioFree.observe(w); });
    }

    function layout() {
      return pdf.getPage(1).then(function (p1) {
        var vp = p1.getViewport({ scale: 1, rotation: rotation });
        ratio = vp.height / vp.width;
        var w = pageWidth();
        pagesEl.innerHTML = '';
        wrappers = []; live = {};
        for (var i = 1; i <= pdf.numPages; i++) {
          var el = document.createElement('div');
          el.className = 'pg pg-ph';
          el.dataset.page = i;
          el.style.width = w + 'px';
          el.style.height = Math.round(w * ratio) + 'px';
          el.textContent = i + '-bet';
          pagesEl.appendChild(el);
          wrappers.push(el);
        }
        pagesEl.classList.toggle('zoomed', zoom > 1);
        observe();
      });
    }

    /* --- Aylantirish --- */
    document.getElementById('rotBtn').addEventListener('click', function () {
      rotation = (rotation + 90) % 360;
      try { localStorage.setItem(ROT_KEY, String(rotation)); } catch (e) {}
      showHint(rotation === 0 ? 'Asl holat' : rotation + '\u00b0 aylantirildi');
      var y = window.scrollY;
      layout().then(function () { window.scrollTo(0, y); });
    });

    /* --- Masshtab: qayta chiziladi, shuning uchun xira bo'lmaydi --- */
    var STEPS = [1, 1.5, 2, 3];
    function setZoom(i) {
      var old = zoom;
      zoom = STEPS[Math.max(0, Math.min(STEPS.length - 1, i))];
      if (zoom === old) return;
      zoomLbl.textContent = Math.round(zoom * 100) + '%';
      var frac = pagesEl.scrollLeft / Math.max(1, pagesEl.scrollWidth);
      var y = window.scrollY * (zoom / old);
      layout().then(function () {
        window.scrollTo(0, y);
        pagesEl.scrollLeft = frac * pagesEl.scrollWidth;
      });
    }
    document.getElementById('zIn').addEventListener('click', function () {
      setZoom(STEPS.indexOf(zoom) + 1);
    });
    document.getElementById('zOut').addEventListener('click', function () {
      setZoom(STEPS.indexOf(zoom) - 1);
    });

    var rs;
    window.addEventListener('resize', function () {
      clearTimeout(rs);
      rs = setTimeout(function () { layout(); }, 250);
    });

    layout();
  }
})();
</script>
</body>
</html>
